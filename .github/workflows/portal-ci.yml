name: Portal build

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "portal/**"
      - ".github/workflows/portal-ci.yml"
      - "supabase/**"
      - "docs/DEPLOYMENT.md"
  pull_request:
    paths:
      - "portal/**"
      - ".github/workflows/portal-ci.yml"
      - "supabase/**"
      - "docs/DEPLOYMENT.md"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify database migration files
        run: |
          for migration in 001_initial_schema.sql 002_patient_consent_and_permissions.sql 003_appointment_permissions.sql 004_validate_therapist_connection_requests.sql; do
            test -s "../supabase/migrations/$migration"
          done
      - name: Install dependencies
        run: npm install
      - name: Build portal
        run: npm run build
